# Faction security vendors - replaces SecTech on faction stations.
# Each faction stocks its own faction security HUD; everything else is shared.
# FactionSecInventory is the generic fallback for factions without a faction HUD (e.g. Gliess Santo).

- type: vendingMachineInventory
  id: FactionSecInventory
  startingInventory:
    Handcuffs: 20
    ClothingEyesGlassesSunglasses: 20
    ClothingEyesHudSecurity: 20
    BolaEnergy: 20
    BreachingCharge: 20
    RiotShield: 2
    RiotBulletShield: 2
    RiotLaserShield: 2

