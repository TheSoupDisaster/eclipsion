- type: entity
  name: passport
  parent: BaseItem
  id: BasePassport
  abstract: true
  description: A passport denoting an individual's nationality and identity.
  components:
    - type: Passport
      cover: PassportCoverBiesel
    - type: ActivatableUI
      key: enum.PassportUiKey.Key
      inHandsOnly: true
      singleUser: true
      requiredItems:
        tags:
        - Write
      verbText: passport-verb-edit
    - type: UserInterface
      interfaces:
        enum.PassportUiKey.Key:
          type: Content.Client._Crescent.Contractors.UI.PassportBoundUserInterface
    - type: Sprite
      sprite: _Crescent/Contractors/Passport.rsi
      layers:
      - state: passport_biesel_open
      - state: passport_species_human
    - type: Appearance
    - type: EmitSoundOnPickup
      sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
    - type: EmitSoundOnDrop
      sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
    - type: EmitSoundOnLand
      sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

