# Faction security HUDs. Each is keyed to one faction's diplomacy and marks everyone in view by the ID they are
# wearing: own faction, allied, neutral (incl. peace and trade), hostile (at war), or unknown (no faction ID).

- type: entity
  id: ShowFactionSecurityIcons
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: ShowJobIcons
  - type: ShowFactionRelationIcons

- type: entity
  abstract: true
  parent: [ClothingEyesBase, ShowFactionSecurityIcons]
  id: ClothingEyesHudFactionBase
  name: faction security hud
  description: A heads-up display that reads the ID of everyone in view and checks it against your faction's diplomatic standing.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Hud/sec.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Hud/sec.rsi
  - type: Tag
    tags:
    - HudSecurity

- type: entity
  parent: ClothingEyesHudFactionBase
  id: ClothingEyesHudFactionDSM
  name: DSM security hud
  description: A Divine Sol Mandate heads-up display. Reads the ID of everyone in view and marks them by the Mandate's diplomatic standing.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/Eyes/FactionHud/dsm.rsi
  - type: Clothing
    sprite: _Crescent/Clothing/Eyes/FactionHud/dsm.rsi
  - type: ShowFactionRelationIcons
    faction: DSM

