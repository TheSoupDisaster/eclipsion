# Neutral civilian HUD: shows whose ID everyone is wearing, but not whether that faction is friend or foe.
- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesHudFactionCivilian
  name: civilian identification hud
  description: A cheap surplus heads-up display that reads the ID of everyone in view and shows which faction issued it. It has no idea who is at war with whom.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/Eyes/FactionHud/civilian.rsi
  - type: Clothing
    sprite: _Crescent/Clothing/Eyes/FactionHud/civilian.rsi
  - type: ShowFactionAffiliationIcons
