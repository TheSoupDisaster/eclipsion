- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase]
  id: ClothingBeltSheathNCWLShashka
  name: communard shashka scabbard
  description: A curved charcoal-leather scabbard with red bindings and a reinforced steel tip. Built to carry a Homeguard boarding shashka on a short belt suspension.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/NCWL/Belt/shashka_scabbard.rsi
    state: sheath
  - type: Clothing
    sprite: _Crescent/Clothing/NCWL/Belt/shashka_scabbard.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: NCWLShashka
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags: [NCWLShashka]
  - type: ItemMapper
    mapLayers:
      sheathed:
        whitelist:
          tags: [NCWLShashka]
  - type: Appearance
  - type: ScabbardVisuals

- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase]
  id: ClothingBeltSheathNCWLEstoc
  name: communard estoc scabbard
  description: A slim charcoal-leather scabbard with red retaining bands and a reinforced steel throat. A compact suspension secures the League's trench estoc at the hip.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/NCWL/Belt/estoc_scabbard.rsi
    state: sheath
  - type: Clothing
    sprite: _Crescent/Clothing/NCWL/Belt/estoc_scabbard.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: NCWLEstoc
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags: [NCWLEstoc]
  - type: ItemMapper
    mapLayers:
      sheathed:
        whitelist:
          tags: [NCWLEstoc]
  - type: Appearance
  - type: ScabbardVisuals

- type: entity
  parent: ClothingBeltSheathNCWLShashka
  id: ClothingBeltSheathNCWLShashkaFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item: [NCWLShashka]

- type: entity
  parent: ClothingBeltSheathNCWLEstoc
  id: ClothingBeltSheathNCWLEstocFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item: [NCWLEstoc]
