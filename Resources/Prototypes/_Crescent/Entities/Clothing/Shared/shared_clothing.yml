# Clothing that originally belonged to the removed ATH faction but is still worn by other factions' jobs
# and placed on maps. The IDs are kept unchanged so existing maps and loadouts keep resolving.

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatAuthorityKommandant
  name: officer's service cap
  description: A no-bullshit military peaked cap for senior officers.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/Shared/Head/servicecap.rsi
  - type: Clothing
    sprite: _Crescent/Clothing/Shared/Head/servicecap.rsi
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon

- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterCoatAuthorityChirurgeon
  name: chirurgeon's labcoat
  description: A sterilized labcoat ready for operating.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/Shared/OuterClothing/chirurgeon.rsi
  - type: Clothing
    sprite: _Crescent/Clothing/Shared/OuterClothing/chirurgeon.rsi
  - type: StaticPrice
    price: 250

- type: entity
  parent: ClothingBeltNfsdWebbing
  id: ClothingBeltAuthorityWebbing
  name: ballistic combat webbing
  description: A set of tactical webbing padded with light kevlar.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/Shared/Belt/webbing.rsi
  - type: Clothing
    sprite: _Crescent/Clothing/Shared/Belt/webbing.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.1
