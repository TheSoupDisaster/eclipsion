# Kit for the faction soldier AI in soldier_ai.yml.
#
# Each faction has one base gear listing the hardsuit and everything under it, which the per-role gears
# pull in as subGear and then add the weapon to. The weapon goes in `inhand` on purpose: NPC gun combat
# only looks at the active hand, and nothing in the HTN can take a gun out of suit storage.

# Imperial Mandate

- type: startingGear
  id: SoldierAIGearDSM
  equipment:
    jumpsuit: ClothingUniformJumpsuitImperialCombat
    outerClothing: ClothingOuterHardsuitImperialSoldier
    head: ClothingHeadHelmetHardsuitImperialSoldier
    mask: ClothingMaskImperialCombatGasmask
    gloves: ClothingHandsGlovesImperialLonggloves
    shoes: ClothingShoesBootsMagDSM
    ears: ClothingHeadsetEmpire
    pocket1: DoubleEmergencyOxygenTankFilled

- type: startingGear
  id: SoldierAIGearDSMRifleman
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponRifleMiller

- type: startingGear
  id: SoldierAIGearDSMShock
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponSubMachineGunBeetle

- type: startingGear
  id: SoldierAIGearDSMShotgunner
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponShotgunReno

- type: startingGear
  id: SoldierAIGearDSMMarksman
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponSniperDSMLegax

- type: startingGear
  id: SoldierAIGearDSMGunner
  subGear:
  - SoldierAIGearDSM
  inhand:
  - WeaponLightMachineGunDSMDominion

