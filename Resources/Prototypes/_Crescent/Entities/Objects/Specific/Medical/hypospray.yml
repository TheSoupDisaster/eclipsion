- type: entity
  name: analgesic medipen
  parent: ChemicalMedipen
  id: PainMedipen
  description: A rapid dose of morphine and epinephrine to prepare patients for field surgery. One medipen gives 75 seconds of pain relief.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: painpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: painpen_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 20
    onlyAffectsMobs: false
    injectOnly: true
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Morphine
          Quantity: 15
        - ReagentId: Epinephrine
          Quantity: 5
  - type: Tag
    tags: []

- type: entity
  name: survival medipen
  parent: ChemicalMedipen
  id: SurvivalMedipen
  description: A cocktail of powerful healing chemicals. Contains Leporazine, and Miner's Salve. Slowly heals damage and stabilizes body temperature. You can overdose on these if you use more than one in quick succession.
  components:
  - type: Sprite
    sprite: /Textures/_Crescent/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: survivalpen
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: survivalpen_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 40
    onlyAffectsMobs: false
    injectOnly: true
    maxPressure: 50 
    injectTime: 5
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 40
        reagents:
          - ReagentId: MinersSalve
            Quantity: 20
          - ReagentId: Leporazine
            Quantity: 20
