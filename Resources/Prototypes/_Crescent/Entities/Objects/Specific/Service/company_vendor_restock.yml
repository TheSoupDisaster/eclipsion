# Company stock modules for the Shinohara / TFCF franchise vendors (see CompanyVendorSystem).
# A module replaces a machine's stock with a full load at its level (1: 20, 2: 50, 3: 100 items). Used on the
# rival company's machine of the same product line it converts the machine instead, provided the host faction
# trades with or is allied to the company. Only company members can install them.
# Unlocked by the Franchise Stock research (Research/company_vendors.yml) and printed on the faction microforge.

- type: entity
  parent: BaseItem
  id: BaseCompanyVendorRestock
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Service/vending_machine_restock.rsi
  - type: Item
    size: Normal
  # Worthless to cargo: the modules are printed from cheap materials and must not become a money printer.
  - type: StaticPrice
    price: 0

- type: entity
  parent: BaseCompanyVendorRestock
  id: BaseCompanyVendorRestockShinoharaCoffee
  abstract: true
  name: Shinohara coffee stock module
  description: A sealed cartridge of Shinohara hot-drink stock, keyed to the corporate coffee machines.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: refill_joe

- type: entity
  parent: BaseCompanyVendorRestockShinoharaCoffee
  id: CompanyVendorRestockShinoharaCoffee1
  name: Shinohara coffee stock module (level 1)
  components:
  - type: CompanyVendorRestock
    company: SHI
    product: Coffee
    level: 1

