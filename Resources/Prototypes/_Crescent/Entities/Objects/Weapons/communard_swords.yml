    sprite: _Crescent/Objects/Weapons/Melee/ncwl_shashka.rsi
    state: icon
  - type: Item
    sprite: _Crescent/Objects/Weapons/Melee/ncwl_shashka.rsi
  - type: MeleeWeapon
    animation: WeaponArcSlash
    wideAnimation: WeaponArcSlash
  - type: Tag
    tags:
    - NCWLShashka
  - type: ReverseEngineering
    recipes:
    - NCWLShashka
    - ClothingBeltSheathNCWLShashka
