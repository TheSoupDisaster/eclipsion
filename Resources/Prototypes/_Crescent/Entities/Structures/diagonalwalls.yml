# base curved wall

- type: entity
  abstract: true
  parent: BaseWallDiagonal
  id: BaseWallCurved
  name: basewall
  suffix: curved
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
    enabled: false

#reinforced

- type: entity
  parent: [BaseWallCurved, WallReinforced]
  id: WallReinforcedDiagonalCurved
  name: reinforced wall
  suffix: curved
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: Structures/Walls/reinforced_diagonalcurved.rsi
    state: state0
  - type: Icon
    sprite:  Structures/Walls/reinforced_diagonalcurved.rsi
    state: state0

- type: entity
  parent: [BaseWallCurved, WallReinforced]
  id: WallReinforcedDiagonalHollow
  name: reinforced wall
