# plastitanium

- type: entity
  parent: [BaseWallCurved, WallPlastitanium]
  id: WallPlastitaniumDiagonalCurved
  name: plastitanium wall
  suffix: curved
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: Structures/Walls/plastitanium_diagonalcurved.rsi
    state: state0
  - type: Icon
    sprite: Structures/Walls/plastitanium_diagonalcurved.rsi
    state: state0
  - type: Reflect
    reflectProb: 0.15
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1000
        behaviors:
          - !type:SpawnEntitiesBehavior
            spawn:
              TitaniumScrap1:
                min: 4
                max: 6
          - !type:ChangeConstructionNodeBehavior
            node: girder
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

- type: entity
  parent: [BaseWallCurved, WallPlastitanium]
  id: WallPlastitaniumDiagonalHollow
