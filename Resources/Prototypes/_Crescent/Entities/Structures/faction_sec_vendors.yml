# Faction security vendors - replace SecTech on faction stations.
# Each faction uses its own security equipment vendor RSI.

- type: entity
  abstract: true
  parent: VendingMachineSec
  id: BaseFactionSecVendor
  description: A vending machine containing security equipment.
  components:
  - type: VendingMachine
    pack: FactionSecInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
    denyState: deny-unshaded
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/security.rsi
    noRot: true
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

- type: entity
  parent: BaseFactionSecVendor
  id: VendingMachineSecDSM
  name: imperial security vendor
  description: A vending machine containing security equipment for the House's enforcers.
  components:
  - type: VendingMachine
    pack: FactionSecInventoryDSM
  - type: Sprite
    sprite: _Crescent/Structures/Machines/Vendors/security_dsm.rsi

