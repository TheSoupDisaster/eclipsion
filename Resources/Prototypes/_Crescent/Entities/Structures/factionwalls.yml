#faction-flagged walls to guide autoturret targeting

# Eclipsion - faction walls also carry their faction's hull strength. The lowest Destructible threshold is the
# wall's real health (girder + scrap); a higher one only decides whether an overkill hit leaves nothing behind.
#   reinforced:   classic 400  | DSM 500  | SHI/TFCF 550  | NCWL 600  | SRM/CMM/TAP classic
#   plastitanium: classic 1100 | DSM 1000 | SHI/TFCF 1100 | NCWL 1200 | SRM/CMM/TAP classic (faction = 2x its reinforced)
#   shuttle:      classic 433  | CMM 800 (straight and diagonal) | Cyberdawn 2000 | other factions classic
# NCWL outbuilds DSM on hull because DSM leans on shields and NCWL mostly does not.

#plastitanium

- type: entity
  parent: WallPlastitanium
  id: WallPlastitaniumSRM
  suffix: SRM Warship
  components:
    - type: NpcFactionMember
      factions:
        - SRMWarship

- type: entity
  parent: WallPlastitanium
  id: WallPlastitaniumSHI
  suffix: SHI Warship
  components:
    - type: NpcFactionMember
      factions:
        - SHIWarship
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1100
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                TitaniumScrap1:
                  min: 4
                  max: 6
            - !type:ChangeConstructionNodeBehavior
              node: girder
            - !type:DoActsBehavior
              acts: [ "Destruction" ]

