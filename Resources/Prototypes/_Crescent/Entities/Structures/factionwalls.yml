# Cyberdawn station hull: the shuttle wall look with capital wall strength.

- type: entity
  parent: WallShuttle
  id: WallShuttleCyberdawn
  suffix: Cyberdawn
  description: Station-grade plating laid over a shuttle wall frame, found on Cyberdawn installations.
  components:
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 4000
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalSlam
        - trigger:
