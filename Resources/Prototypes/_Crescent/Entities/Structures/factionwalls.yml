      factions:
        - CMMWarship
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1600
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalSlam
        - trigger:
            !type:DamageTrigger
            damage: 800
          behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: MetalSlam
          - !type:ChangeConstructionNodeBehavior
            node: girder
          - !type:SpawnEntitiesBehavior
            spawn:
              SteelScrap1:
                min: 2
                max: 4
          - !type:DoActsBehavior
            acts: ["Destruction"]

# CMM shuttle diagonals, so CMM corners keep the CMM hull instead of the plain shuttle wall's.

