#faction-flagged thrusters
# all faction thrusters share the same stats; only the sprite, NPC faction and board differ

- type: entity
  id: BaseThrusterFaction
  parent: Thruster
  abstract: true
  components:
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: StructuralMetallicStrong
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:ChangeConstructionNodeBehavior
            node: machineFrame

- type: entity
  id: ThrusterTFSCFighter
  parent: BaseThrusterFaction
  suffix: TFCF, Fighter
  components:
    - type: NpcFactionMember
      factions:
        - TFSCFighter
    - type: Sprite
      sprite: _Crescent/Structures/thrustersyn.rsi
    - type: Machine
      board: TFSCFighterCircuitBoard

