# Diplomatic standing icons drawn by faction HUDs (ShowFactionRelationIcons). The target's side is read from the ID
# worn in their ID slot, so these describe the credential, not necessarily the person wearing it.

- type: factionIcon
  id: FactionRelationIcon
  abstract: true
  # Takes the mindshield icon's old slot: right after the job icon (1), so it sits directly beneath it.
  priority: 2
  locationPreference: Right
  isShaded: true

- type: factionIcon
  parent: FactionRelationIcon
  id: FactionRelationIconOwn
  icon:
    sprite: /Textures/_Crescent/Interface/Misc/faction_relation_icons.rsi
    state: own

- type: factionIcon
  parent: FactionRelationIcon
  id: FactionRelationIconAllied
  icon:
    sprite: /Textures/_Crescent/Interface/Misc/faction_relation_icons.rsi
    state: allied

- type: factionIcon
  parent: FactionRelationIcon
  id: FactionRelationIconNeutral
  icon:
    sprite: /Textures/_Crescent/Interface/Misc/faction_relation_icons.rsi
    state: neutral

- type: factionIcon
  parent: FactionRelationIcon
  id: FactionRelationIconHostile
  icon:
    sprite: /Textures/_Crescent/Interface/Misc/faction_relation_icons.rsi
    state: hostile

- type: factionIcon
  parent: FactionRelationIcon
  id: FactionRelationIconUnknown
  icon:
    sprite: /Textures/_Crescent/Interface/Misc/faction_relation_icons.rsi
    state: unknown

# Faction badges drawn by the neutral civilian HUD (ShowFactionAffiliationIcons). Looked up by name as
# FactionAffiliationIcon<FactionId>; a faction with no entry here shows as FactionRelationIconUnknown.

- type: factionIcon
  id: FactionAffiliationIcon
