# indestructible and invisible occluder wall, makes it look like floor just fades into nothing
- type: entity
  parent: BaseStructure
  id: WallDimension
  name: dimension wall
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  # Only shows with markers visible, so mappers can see it.
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/environment.rsi
    layers:
    - state: base-red
    - state: wall
  - type: Tag
    tags:
    - Wall
  - type: PlacementReplacement
    key: walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
